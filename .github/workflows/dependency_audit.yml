name: Dependency Audit (OSV) (Reusable)

on:
  workflow_call:
    inputs:
      scan_args:
        description: |
          Arguments passed to OSV-Scanner (one per line). NOTE: --format and --output are managed by the underlying workflow.
        type: string
        default: |-
          --recursive
          ./
      results_file_name:
        type: string
        default: "osv-results.sarif"
      upload_sarif:
        type: boolean
        default: true
      fail_on_vuln:
        type: boolean
        default: true
      download_artifact:
        description: Optional artifact to download before scanning (for preprocessing)
        type: string
        default: ""
      matrix_property:
        description: Optional unique identifier per matrix run (e.g., amd64-)
        type: string
        default: ""

jobs:
  # INTENTIONALLY UNBOUNDED — no timeout-minutes here, and that is not an
  # oversight (ERA-207 audited every job in this repo).
  #
  # Two reasons it cannot be set and does not need to be:
  #
  #   1. Structurally impossible from our side. This job calls a reusable
  #      workflow with `uses:`, and GitHub rejects timeout-minutes on such a
  #      job — only name/uses/with/secrets/needs/if/permissions are allowed.
  #      The key has to live on the job inside the called workflow, and
  #      osv-scanner-reusable.yml@v2.3.1 exposes no timeout input to pass one
  #      through (its inputs are scan-args, results-file-name,
  #      download-artifact, upload-sarif, fail-on-vuln, matrix-property,
  #      checkout-submodules and ref).
  #
  #   2. Low stakes anyway. Upstream hardcodes runs-on: ubuntu-latest, so a
  #      hang burns GitHub-hosted minutes and does not occupy our shared
  #      self-hosted node. Hosted runners also do get GitHub's 360-minute
  #      default, which self-hosted ones demonstrably do not.
  #
  # If this ever needs a real ceiling, the route is an upstream PR adding a
  # timeout input, or vendoring the scan into a normal job of our own.
  osv:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.1
    with:
      scan-args: ${{ inputs.scan_args }}
      results-file-name: ${{ inputs.results_file_name }}
      upload-sarif: ${{ inputs.upload_sarif }}
      fail-on-vuln: ${{ inputs.fail_on_vuln }}
      download-artifact: ${{ inputs.download_artifact }}
      matrix-property: ${{ inputs.matrix_property }}
